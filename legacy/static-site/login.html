<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Onyx Ledger</title>
<link rel="stylesheet" href="onyx.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230C0A08'/%3E%3Cpath d='M8 3l4 3-4 7-4-7z' fill='%23E3BE86'/%3E%3C/svg%3E" />
</head>
<body>
<div class="authwrap">
  <div class="authcard card glow">
    <div class="card-b">
      <a class="brand" href="index.html" style="margin-bottom:1.2rem"><span class="dot"></span>Onyx&nbsp;Ledger<span class="os">TaxOS</span></a>
      <h1 class="auth-h">Welcome back</h1>
      <p class="auth-sub">Independent educational tool — not the CRA. Your demo profile is saved in this browser.</p>
      <form id="form" novalidate>
        <div class="grid" style="gap:.9rem">
          <label class="field">Email
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label class="field">Password
            <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required />
          </label>
        </div>
        <p class="err" id="err"></p>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Sign in</button>
      </form>
      <div class="secnote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg> Stored in your browser · <a href="privacy.html" style="color:var(--accent)">Privacy</a> · <a href="about.html" style="color:var(--accent)">About</a></div>
      <p class="auth-alt">New to Onyx Ledger? <a href="signup.html">Create a demo profile</a></p>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
  if (ONYX.token()) location.href = 'dashboard.html';
  const form = document.getElementById('form'), err = document.getElementById('err'), submit = document.getElementById('submit');
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    const email = document.getElementById('email').value.trim(), password = document.getElementById('password').value;
    submit.disabled = true; submit.textContent = 'Signing in…';
    try {
      const { token, user } = await ONYX.api('/auth/login', { method: 'POST', body: { email, password } });
      ONYX.setAuth(token, user); location.href = 'dashboard.html';
    } catch (ex) { err.textContent = ex.message; submit.disabled = false; submit.textContent = 'Sign in'; }
  });
</script>
</body>
</html>
